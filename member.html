<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>บัญชีสมาชิก | Shopthai2026</title><link rel="stylesheet" href="assets/member-preview.css"><script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script defer src="assets/cms/settings.js"></script><script defer src="assets/member-preview.js?v=421"></script></head><body><header><a href="index.html">Shopthai2026</a><a href="products.html">เลือกซื้อสินค้า</a></header><main><h1>บัญชีสมาชิก — ทดสอบ</h1><p>ยังไม่เปิดรับชำระเงินหรือเผยแพร่หน้าร้าน</p><p id="chosen"></p><p id="status" role="status" aria-live="polite">กำลังตรวจสอบการเชื่อมต่อ</p><section id="guest" hidden><h2>เข้าสู่ระบบ</h2><form id="login"><label>อีเมล<input name="email" type="email" required autocomplete="email"></label><label>รหัสผ่าน<input name="password" type="password" required autocomplete="current-password"></label><button>เข้าสู่ระบบ</button></form><button id="google" class="secondary">เข้าสู่ระบบ / สมัครด้วย Google</button><button id="forgot" class="secondary">ส่งลิงก์ตั้งรหัสผ่านใหม่ (ใช้อีเมลด้านบน)</button><hr><h2>สมัครสมาชิก</h2><form id="signup"><label>ชื่อผู้ใช้ (a-z, 0-9, _ จำนวน 3–30 ตัว)<input name="username" required pattern="[a-z0-9_]{3,30}" autocomplete="username"></label><label>เบอร์โทรศัพท์<input name="phone" type="tel" required pattern="\+?[0-9]{9,15}" autocomplete="tel"></label><label>อีเมล<input name="email" type="email" required autocomplete="email"></label><label>รหัสผ่าน (อย่างน้อย 12 ตัว)<input name="password" type="password" minlength="12" required autocomplete="new-password"></label><p>ข้อมูลใช้เพื่อจัดการบัญชีสมาชิก เบอร์โทรยังไม่ได้ยืนยันด้วย OTP</p><button>สมัครสมาชิก</button></form></section><section id="account" hidden><h2>ข้อมูลสมาชิก</h2><p id="email"></p><form id="profile"><label>ชื่อผู้ใช้<input name="username" required pattern="[a-z0-9_]{3,30}"></label><label>เบอร์โทรศัพท์<input name="phone" type="tel" required pattern="\+?[0-9]{9,15}"></label><button>บันทึกโปรไฟล์</button></form><a href="dashboard.html">เข้าสู่แดชบอร์ด / เปิดร้าน</a><button id="logout" class="secondary">ออกจากระบบ</button></section><section id="recovery" hidden><h2>ตั้งรหัสผ่านใหม่</h2><form id="reset"><label>รหัสผ่านใหม่<input name="password" type="password" minlength="12" required autocomplete="new-password"></label><button>บันทึกรหัสผ่านใหม่</button></form></section></main><footer>Shopthai2026 • ระบบสมาชิกทดสอบ</footer></body></html>
