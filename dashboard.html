<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Member Dashboard | Shopthai2026</title><link rel="stylesheet" href="assets/member-preview.css"><script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script defer src="assets/cms/settings.js"></script><script defer src="assets/dashboard-preview.js?v=41"></script></head><body><header><a href="index.html">Shopthai2026</a><a href="member.html">บัญชีสมาชิก</a><a href="pricing.html">แพ็กเกจ</a></header><main class="wide"><h1>Member Dashboard (ทดลอง)</h1><p id="status" role="status">กำลังตรวจสอบบัญชี</p><section id="setup" hidden><h2>เปิดร้านค้า</h2><form id="shop"><label>ชื่อร้าน<input name="name" required minlength="3" maxlength="100"></label><label>ชื่อ URL ภาษาอังกฤษ<input name="slug" required pattern="[a-z0-9][a-z0-9\-]{2,49}"></label><button>เปิดร้าน Free</button></form></section><section id="panel" hidden><h2 id="shopname"></h2><p id="quota"></p><p>สินค้าเป็นฉบับร่างเท่านั้น · ยังไม่รับชำระเงิน</p><form id="product"><h3 id="formtitle">เพิ่มสินค้า</h3><label>ชื่อสินค้า<input name="name" required maxlength="200"></label><label>รายละเอียด<textarea name="description" maxlength="10000"></textarea></label><label>หมวดหมู่<input name="category" maxlength="100" value="general"></label><label>ราคา (บาท)<input name="price" type="number" min="0" max="9999999999.99" step="0.01" required></label><label>URL รูปภาพ HTTPS<input name="image_url" type="url" maxlength="2048"></label><label>URL ซื้อสินค้า HTTPS<input name="purchase_url" type="url" maxlength="2048"></label><button>บันทึกสินค้า</button><button type="button" id="cancel" class="secondary">ล้างฟอร์ม</button></form><h2>สินค้าของฉัน</h2><div id="items"></div></section></main></body></html>
